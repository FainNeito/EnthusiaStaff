name: Staff Platform Staging Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/staff-platform-staging-release.yml"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: staff-platform-staging-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish staging Staff platform
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
            test "${TESTED_SHA}" = "${GITHUB_SHA}"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            test "${GITHUB_REF}" = 'refs/heads/main'
          fi
          echo "TESTED_SHA=${TESTED_SHA}" >> "${GITHUB_ENV}"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Build and verify runtime JARs
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew clean check runtimeJars \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain
          test "${TESTED_SHA}" = "$(git rev-parse HEAD)"

      - name: Prepare fixed staging assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p staging-release

          mapfile -d '' paper_jars < <(
            find paper/build/libs -maxdepth 1 -type f \
              -name 'EnthusiaStaff-Paper-*.jar' \
              ! -name '*-sources.jar' -print0
          )
          mapfile -d '' velocity_jars < <(
            find velocity/build/libs -maxdepth 1 -type f \
              -name 'EnthusiaStaff-Velocity-*.jar' \
              ! -name '*-sources.jar' -print0
          )

          if (( ${#paper_jars[@]} != 1 )); then
            printf 'Expected exactly one Paper runtime JAR; found %d\n' "${#paper_jars[@]}" >&2
            exit 1
          fi
          if (( ${#velocity_jars[@]} != 1 )); then
            printf 'Expected exactly one Velocity runtime JAR; found %d\n' "${#velocity_jars[@]}" >&2
            exit 1
          fi

          cp -- "${paper_jars[0]}" staging-release/EnthusiaStaff-Paper.jar
          cp -- "${velocity_jars[0]}" staging-release/EnthusiaStaff-Velocity.jar

          test -s staging-release/EnthusiaStaff-Paper.jar
          test -s staging-release/EnthusiaStaff-Velocity.jar
          unzip -t staging-release/EnthusiaStaff-Paper.jar >/dev/null
          unzip -t staging-release/EnthusiaStaff-Velocity.jar >/dev/null

          unzip -p staging-release/EnthusiaStaff-Paper.jar plugin.yml \
            | grep -Fx 'main: net.enthusia.staff.paper.EnthusiaStaffPaperPlugin' >/dev/null
          jar tf staging-release/EnthusiaStaff-Velocity.jar \
            | grep -Fx 'net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.class' >/dev/null

          (
            cd staging-release
            sha256sum EnthusiaStaff-Paper.jar > EnthusiaStaff-Paper.jar.sha256
            sha256sum EnthusiaStaff-Velocity.jar > EnthusiaStaff-Velocity.jar.sha256
          )
          {
            echo "source_sha=${TESTED_SHA}"
            echo 'environment=staging'
            echo 'paper_artifact=EnthusiaStaff-Paper.jar'
            echo 'velocity_artifact=EnthusiaStaff-Velocity.jar'
            echo "built_by_run=${GITHUB_RUN_ID}"
            echo "built_by_attempt=${GITHUB_RUN_ATTEMPT}"
          } > staging-release/staff-platform-staging-source.txt

      - name: Validate pull-request staging assets
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s staging-release/EnthusiaStaff-Paper.jar
          test -s staging-release/EnthusiaStaff-Paper.jar.sha256
          test -s staging-release/EnthusiaStaff-Velocity.jar
          test -s staging-release/EnthusiaStaff-Velocity.jar.sha256
          test -s staging-release/staff-platform-staging-source.txt
          grep -Fx "source_sha=${TESTED_SHA}" staging-release/staff-platform-staging-source.txt >/dev/null
          echo 'Staff platform staging assets built successfully; publication is disabled on pull requests.' \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish fixed staging release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          readonly tag='staff-platform-staging'
          readonly title='EnthusiaStaff Platform — Staging'
          notes="${RUNNER_TEMP}/staff-platform-staging-notes.md"
          {
            echo 'Temporary Paper and Velocity runtimes built from canonical `main`.'
            echo
            echo "Source SHA: \`${TESTED_SHA}\`"
            echo
            echo 'This release is staging-only. It contains no runtime configuration, credentials, database data, or secrets.'
          } > "${notes}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="${TESTED_SHA}" \
              -F force=true >/dev/null
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${TESTED_SHA}" \
              --title "${title}" \
              --notes-file "${notes}" \
              --prerelease
          else
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${TESTED_SHA}" \
              --title "${title}" \
              --notes-file "${notes}" \
              --prerelease
          fi

          gh release upload "${tag}" \
            staging-release/EnthusiaStaff-Paper.jar \
            staging-release/EnthusiaStaff-Paper.jar.sha256 \
            staging-release/EnthusiaStaff-Velocity.jar \
            staging-release/EnthusiaStaff-Velocity.jar.sha256 \
            staging-release/staff-platform-staging-source.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Verify published staging assets and provenance
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          readonly tag='staff-platform-staging'
          published="$(
            gh release view "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' \
              | sort
          )"
          grep -Fxq 'EnthusiaStaff-Paper.jar' <<< "${published}"
          grep -Fxq 'EnthusiaStaff-Paper.jar.sha256' <<< "${published}"
          grep -Fxq 'EnthusiaStaff-Velocity.jar' <<< "${published}"
          grep -Fxq 'EnthusiaStaff-Velocity.jar.sha256' <<< "${published}"
          grep -Fxq 'staff-platform-staging-source.txt' <<< "${published}"

          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.target_commitish')"
          test "${tag_sha}" = "${TESTED_SHA}"
          test "${release_target}" = "${TESTED_SHA}"

          {
            echo '## Staff platform staging release'
            echo
            echo "- Exact source: \`${TESTED_SHA}\`"
            echo '- Release tag: `staff-platform-staging`'
            echo "- Tag SHA: \`${tag_sha}\`"
            echo '- Paper asset: `EnthusiaStaff-Paper.jar`'
            echo '- Velocity asset: `EnthusiaStaff-Velocity.jar`'
          } >> "${GITHUB_STEP_SUMMARY}"
