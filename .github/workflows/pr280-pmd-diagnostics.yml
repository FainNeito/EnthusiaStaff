name: PR 280 PMD diagnostics

on:
  push:
    branches:
      - codex/reopening-safety-2026-10-01

permissions:
  contents: read

jobs:
  pmd:
    name: Report PMD 6.55 findings on changed Java
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run repository PMD rules on PR Java files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          if (( ${#files[@]} == 0 )); then
            echo "No changed Java files."
            exit 0
          fi
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          input="$(IFS=,; echo "${files[*]}")"
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          status=$?
          set -e
          echo "PMD exit status: ${status}"
          cat /tmp/pmd-findings.txt
          if (( status != 0 && status != 4 )); then
            exit "${status}"
          fi
