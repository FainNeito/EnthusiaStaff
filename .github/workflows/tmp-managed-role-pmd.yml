name: Temporary managed-role PMD diagnostic

on:
  push:
    branches:
      - feature/managed-role-provider-shadow

permissions:
  contents: read

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository PMD 6.55 rules
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error             "https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip"             -o /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd             -d paper/src/main/java,paper/src/test/java,staff-bot/src/main/java,staff-bot/src/test/java,persistence/src/main/java             -R ruleset.xml             -f text             -r /tmp/pmd.txt
          status=$?
          set -e
          cat /tmp/pmd.txt
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
            exit "$status"
          fi
