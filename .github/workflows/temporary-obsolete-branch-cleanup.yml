# Triggered after workflow registration so GitHub sees it on the parent commit.
name: Temporary obsolete branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'wsg138/EnthusiaStaff'
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact absorbed branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feature/discord-command-bridge"
            "package/es-f01004-cheat-tester-folia-handoff"
            "package/es-t01-staff-teleport-hardening"
            "package/es-d13-role-sync-replacement"
          )
          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
