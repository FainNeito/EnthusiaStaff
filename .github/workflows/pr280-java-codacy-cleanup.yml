name: PR 280 Java Codacy cleanup

on:
  push:
    branches:
      - codex/reopening-safety-2026-10-01

permissions:
  contents: write

jobs:
  cleanup:
    name: Apply and validate Java cleanup
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin codex/reopening-safety-2026-10-01
          test "$(git rev-parse origin/codex/reopening-safety-2026-10-01)" = "$GITHUB_SHA"

      - name: Apply bounded Java cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/pr280-java-cleanup.py
          git diff --check

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Require target methods within complexity limit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet lizard==1.17.31
          python3 - <<'PY'
          import lizard

          targets = {
              "velocity/src/main/java/net/enthusia/staff/velocity/StaffSessionTransferPolicy.java": "recoveryReturnAllowed",
              "paper/src/test/java/net/enthusia/staff/paper/staff/StaffRestorationComparisonTest.java": "everyStoredFieldStillRejectsAnActualStateDifference",
              "staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationActionApiService.java": "toIntent",
              "staff-bot/src/main/java/net/enthusia/staff/discordbot/StaffBotConfiguration.java": "validHttpsOrigin",
              "paper/src/main/java/net/enthusia/staff/paper/auth/DiscordStaffAuthorityEndpoint.java": "handlePunishment",
              "paper/src/main/java/net/enthusia/staff/paper/PaperNetworkMessageHandler.java": "punishmentNotification",
          }
          failures = []
          for path, name in targets.items():
              analysis = lizard.analyze_file(path)
              matches = [function for function in analysis.function_list if function.name == name]
              if not matches:
                  failures.append(f"{path}: missing {name}")
                  continue
              worst = max(function.cyclomatic_complexity for function in matches)
              print(f"{path}:{name} CCN={worst}")
              if worst > 8:
                  failures.append(f"{path}:{name} CCN {worst} > 8")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Require repository PMD clean on changed Java
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only -- '*.java' | sort -u)
          test "${#files[@]}" -gt 0
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          input="$(IFS=,; echo "${files[*]}")"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd -d "$input" -R ruleset.xml -f text -r /tmp/pmd.txt
          cat /tmp/pmd.txt
          test ! -s /tmp/pmd.txt

      - name: Run full Java validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks clean test check runtimeJars
          git diff --check

      - name: Commit validated Java cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr280-java-codacy-cleanup.yml .github/pr280-java-cleanup.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Resolve remaining Java static analysis findings"
          git fetch --no-tags origin codex/reopening-safety-2026-10-01
          test "$(git rev-parse origin/codex/reopening-safety-2026-10-01)" = "$GITHUB_SHA"
          git push origin HEAD:codex/reopening-safety-2026-10-01
