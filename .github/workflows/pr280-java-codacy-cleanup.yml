      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Require bounded changed-method complexity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet lizard==1.17.31
          lizard -C 8 \
            velocity/src/main/java/net/enthusia/staff/velocity/StaffSessionTransferPolicy.java \
            paper/src/test/java/net/enthusia/staff/paper/staff/StaffRestorationComparisonTest.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationActionApiService.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/StaffBotConfiguration.java \
            paper/src/main/java/net/enthusia/staff/paper/auth/DiscordStaffAuthorityEndpoint.java \
            paper/src/main/java/net/enthusia/staff/paper/PaperNetworkMessageHandler.java

      - name: Require repository PMD clean on changed Java
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only -- '*.java' | sort -u)
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          input="$(IFS=,; echo "${files[*]}")"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd -d "$input" -R ruleset.xml -f text -r /tmp/pmd.txt
          cat /tmp/pmd.txt
          test ! -s /tmp/pmd.txt

      - name: Run full Java validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks clean test check runtimeJars
          git diff --check

      - name: Commit validated Java cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr280-java-codacy-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Resolve remaining Java static analysis findings"
          git fetch --no-tags origin codex/reopening-safety-2026-10-01
          test "$(git rev-parse origin/codex/reopening-safety-2026-10-01)" = "$GITHUB_SHA"
          git push origin HEAD:codex/reopening-safety-2026-10-01
