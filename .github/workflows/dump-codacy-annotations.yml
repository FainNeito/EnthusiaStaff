name: Dump Codacy annotations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/dump-codacy-annotations.yml"

permissions:
  contents: read
  checks: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Read previous exact-head Codacy annotations
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: "110891163814"
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/check-runs/$CHECK_RUN_ID/annotations?per_page=100"             | jq -c '.[] | {path,start_line,end_line,annotation_level,title,message,raw_details}'
