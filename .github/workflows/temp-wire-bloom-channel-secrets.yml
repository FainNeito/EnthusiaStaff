name: Temporary wire Bloom channel secrets

on:
  push:
    branches:
      - fix/bloom-channel-private-secrets
    paths:
      - .github/workflows/temp-wire-bloom-channel-secrets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/bloom-channel-private-secrets
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Wire file-backed secrets into Velocity runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java')
          text = path.read_text(encoding='utf-8')

          old_start = '''        Map<String, SecretKey> backendKeys = new LinkedHashMap<>();
                  loaded.backendSecretEnvironments().forEach((serverId, environment) ->
                          backendKeys.put(serverId, secretFromEnvironment(environment)));
          SecretKey proxyKey = secretFromEnvironment(loaded.channelProxySecretEnvironment());
          SSLContext tlsContext = serverTlsContext(loaded);
          try {
          '''
          new_start = '''        VelocityChannelSecrets.Loaded secrets = VelocityChannelSecrets.load(
                  loaded,
                  dataDirectory,
                  System::getenv
          );
          Map<String, SecretKey> backendKeys = secrets.backendKeys();
          SecretKey proxyKey = secrets.proxyKey();
          char[] tlsStorePassword = secrets.tlsStorePassword();
          SSLContext tlsContext;
          try {
              tlsContext = serverTlsContext(loaded, tlsStorePassword);
          } finally {
              Arrays.fill(tlsStorePassword, '\\0');
          }
          try {
          '''

          old_helpers = '''    private static SecretKey secretFromEnvironment(String environment) {
              String encoded = System.getenv(environment);
              return SecretKeyMaterial.hmacSha256FromBase64(encoded);
          }

          private static SSLContext serverTlsContext(VelocityConfiguration configuration) {
              char[] password = passwordFromEnvironment(configuration.channelTlsKeyStorePasswordEnvironment());
              try {
                  return TlsContextLoader.server(configuration.channelTlsKeyStorePath(), password);
              } finally {
                  Arrays.fill(password, '\\0');
              }
          }

          private static char[] passwordFromEnvironment(String environment) {
              String value = System.getenv(environment);
              if (value == null || value.isBlank()) {
                  throw new IllegalStateException("A required channel TLS store password environment variable is missing");
              }
              return value.toCharArray();
          }
          '''
          new_helpers = '''    private static SSLContext serverTlsContext(
                  VelocityConfiguration configuration,
                  char[] password
          ) {
              return TlsContextLoader.server(configuration.channelTlsKeyStorePath(), password);
          }
          '''

          if text.count(old_start) != 1:
              raise SystemExit(f'expected one channel startup block, found {text.count(old_start)}')
          if text.count(old_helpers) != 1:
              raise SystemExit(f'expected one legacy helper block, found {text.count(old_helpers)}')

          text = text.replace(old_start, new_start)
          text = text.replace(old_helpers, new_helpers)
          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'VelocityChannelSecrets.load' velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java
          if grep -q 'secretFromEnvironment' velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java; then
            echo 'legacy channel environment-only helper still present' >&2
            exit 1
          fi

      - name: Focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :common:test :velocity:test :velocity:compileJava --no-daemon --console=plain
          git diff --check

      - name: Commit product fix and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/temp-wire-bloom-channel-secrets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java
          git commit -m 'Wire private channel secrets into Velocity runtime'
          git push origin HEAD:fix/bloom-channel-private-secrets
