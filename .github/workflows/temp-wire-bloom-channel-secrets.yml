name: Temporary wire Bloom channel secrets

on:
  push:
    branches:
      - fix/bloom-channel-private-secrets
    paths:
      - .github/workflows/temp-wire-bloom-channel-secrets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/bloom-channel-private-secrets
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Wire file-backed secrets into Velocity runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java')
          text = path.read_text(encoding='utf-8')

          startup_marker = '        Map<String, SecretKey> backendKeys = new LinkedHashMap<>();\n'
          outer_try_marker = '        try {\n            PersistentChannelServer server = createChannelServer(\n'
          start = text.find(startup_marker)
          if start < 0:
              raise SystemExit('channel startup marker not found')
          end = text.find(outer_try_marker, start)
          if end < 0:
              raise SystemExit('channel server start marker not found')

          replacement = '''        VelocityChannelSecrets.Loaded secrets = VelocityChannelSecrets.load(
                  loaded,
                  dataDirectory,
                  System::getenv
          );
          Map<String, SecretKey> backendKeys = secrets.backendKeys();
          SecretKey proxyKey = secrets.proxyKey();
          char[] tlsStorePassword = secrets.tlsStorePassword();
          SSLContext tlsContext;
          try {
              tlsContext = serverTlsContext(loaded, tlsStorePassword);
          } finally {
              Arrays.fill(tlsStorePassword, '\\0');
          }
          '''
          text = text[:start] + replacement + text[end:]

          helper_start_marker = '    private static SecretKey secretFromEnvironment(String environment) {\n'
          helper_end_marker = '    @SuppressWarnings("PMD.GuardLogStatement") // SLF4J placeholders defer formatting; arguments are enums.\n'
          helper_start = text.find(helper_start_marker)
          if helper_start < 0:
              raise SystemExit('legacy channel secret helper marker not found')
          helper_end = text.find(helper_end_marker, helper_start)
          if helper_end < 0:
              raise SystemExit('post-helper marker not found')

          helper_replacement = '''    private static SSLContext serverTlsContext(
                  VelocityConfiguration configuration,
                  char[] password
          ) {
              return TlsContextLoader.server(configuration.channelTlsKeyStorePath(), password);
          }

          '''
          text = text[:helper_start] + helper_replacement + text[helper_end:]
          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'VelocityChannelSecrets.load' velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java
          if grep -q 'secretFromEnvironment' velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java; then
            echo 'legacy channel environment-only helper still present' >&2
            exit 1
          fi
          if grep -q 'passwordFromEnvironment' velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java; then
            echo 'legacy channel password environment-only helper still present' >&2
            exit 1
          fi

      - name: Focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :common:test :velocity:test :velocity:compileJava --no-daemon --console=plain
          git diff --check

      - name: Commit product fix and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/temp-wire-bloom-channel-secrets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java
          git commit -m 'Wire private channel secrets into Velocity runtime'
          git push origin HEAD:fix/bloom-channel-private-secrets
