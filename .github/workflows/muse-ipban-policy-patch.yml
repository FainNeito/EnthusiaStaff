name: Temporary Muse ipban policy finalizer

on:
  push:
    branches:
      - fix/muse-test-run-remaining-staff
    paths:
      - .github/workflows/muse-ipban-policy-patch.yml

permissions:
  contents: write

jobs:
  finalize-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/muse-test-run-remaining-staff
      - name: Bump policy catalog version
        run: |
          python3 -c 'from pathlib import Path; p=Path("paper/src/main/resources/reason-policies.yml"); s=p.read_text(); assert "id: evasion.network-identity-ban" in s; p.write_text(s.replace("version: \\"2026-07-26.1\\"", "version: \\"2026-09-26.1\\"", 1))'
          git rm .github/workflows/muse-ipban-policy-patch.yml
      - name: Commit final policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/src/main/resources/reason-policies.yml
          git commit -m "fix: version network identity ban presets"
          git push origin HEAD:fix/muse-test-run-remaining-staff
