name: Temporary clean channel secret wiring

on:
  push:
    branches:
      - fix/bloom-channel-private-secrets
    paths:
      - .github/workflows/temp-clean-channel-secret-wiring.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/bloom-channel-private-secrets
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Normalize Velocity wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java')
          text = path.read_text(encoding='utf-8')
          old = '''        VelocityChannelSecrets.Loaded secrets = VelocityChannelSecrets.load(
          loaded,
          dataDirectory,
          System::getenv
  );
  Map<String, SecretKey> backendKeys = secrets.backendKeys();
  SecretKey proxyKey = secrets.proxyKey();
  char[] tlsStorePassword = secrets.tlsStorePassword();
  SSLContext tlsContext;
  try {
      tlsContext = serverTlsContext(loaded, tlsStorePassword);
  } finally {
      Arrays.fill(tlsStorePassword, '\\0');
  }
  '''
          new = '''        VelocityChannelSecrets.Loaded secrets = VelocityChannelSecrets.load(
                  loaded,
                  dataDirectory,
                  System::getenv
          );
          Map<String, SecretKey> backendKeys = secrets.backendKeys();
          SecretKey proxyKey = secrets.proxyKey();
          char[] tlsStorePassword = secrets.tlsStorePassword();
          SSLContext tlsContext;
          try {
              tlsContext = serverTlsContext(loaded, tlsStorePassword);
          } finally {
              Arrays.fill(tlsStorePassword, '\\0');
          }
  '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed wiring block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew \
            :common:test \
            :velocity:test \
            :velocity:compileJava \
            --no-daemon \
            --console=plain

      - name: Commit clean product tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/temp-clean-channel-secret-wiring.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java
          git commit -m 'Clean Velocity channel secret wiring'
          git push origin HEAD:fix/bloom-channel-private-secrets
