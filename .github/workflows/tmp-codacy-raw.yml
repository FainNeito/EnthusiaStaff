name: Temporary Codacy raw findings

on:
  push:
    branches:
      - feature/managed-role-provider-shadow

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dump public Codacy PR issues
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error             "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/342/issues?status=new&limit=100"             | jq .
