name: Temporary PR 344 Codacy inspection

on:
  push:
    branches:
      - feature/minecraft-punishment-discord-notifications

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dump public Codacy PR issues
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error             "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/344/issues?status=new&limit=100"             | jq .
